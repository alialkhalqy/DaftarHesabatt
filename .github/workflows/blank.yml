
# DaftarHesabatt - Android Build Workflow

name: DaftarHesabatt APK

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DaftarHesabatt Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle Permissions
        run: chmod +x ./gradlew

      - name: Build DaftarHesabatt APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload DaftarHesabatt APK
        uses: actions/upload-artifact@v4
        with:
          name: DaftarHesabatt-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
